name = "squishy-votes"
main = "worker.js"
compatibility_date = "2026-08-01"

# The KV namespace that stores 👍 counts. Create it once with:
#   wrangler kv namespace create VOTES
# then paste the returned id below.
[[kv_namespaces]]
binding = "VOTES"
id = "c4ef8c92513b42cb838f8cd64faa0d06"

[vars]
# The site origin allowed to POST votes (CORS). Set to your deployed site.
ALLOWED_ORIGIN = "https://bookchiq.github.io"
